apiVersion: apps/v1
kind: Deployment

metadata:
  name: student-management-system

spec:
  replicas: 2

  selector:
    matchLabels:
      app: student-management-system

  template:
    metadata:
      labels:
        app: student-management-system

    spec:
      containers:
        - name: student-management-system
          image: sagar1004/student-management-system:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8080