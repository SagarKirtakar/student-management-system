apiVersion: apps/v1
kind: Deployment

metadata:
  name: student-management-system

spec:
  replicas: 2

  selector:
    matchLabels:
      app: student-management-system

  template:
    metadata:
      labels:
        app: student-management-system

    spec:
      containers:
        - name: student-management-system
          image: sagar1004/student-management-system:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          env:
            - name: DB_HOST
              value: mysql

            - name: DB_NAME
              value: student_management_system

            - name: DB_USERNAME
              value: root

            - name: DB_PASSWORD
              value: Sagar@112455