services:

  mysql:
    image: mysql:8.4
    container_name: sms-mysql

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: student_management_system

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - sms-network

  app:
    image: student-management-system:1.0
    container_name: sms-app

    depends_on:
      - mysql

    restart: always

    ports:
      - "8080:8080"

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/student_management_system
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root

    networks:
      - sms-network

networks:
  sms-network:

volumes:
  mysql_data: